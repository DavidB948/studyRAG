[project]
name = "studyrag"
version = "0.1.0"
description = "Retrieval-augmented study assistant over course notes"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pypdf>=6.15.0",
    "sentence-transformers>=6.0.0",
    "openai>=3.6.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

# Makes `studyrag` importable from scripts and tests without sys.path hacks:
# uv installs the project itself into the venv in editable mode.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studyrag"]

[dependency-groups]
dev = [
    "langchain-community<0.4",
    "langchain-openai>=1.6.0",
    "pillow>=12.3.0",
    "pytest>=8.3",
    "ragas>=0.3.1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# The package is not installed into the venv; tests import it from the repo root.
pythonpath = ["."]
testpaths = ["tests"]
